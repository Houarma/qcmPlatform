version: '3.8'

services:

  nginx:
    image: nginx:alpine
    container_name: qcm_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - ml-service
    networks:
      - qcm_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcm_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/qcmdb
      - SPRING_DATASOURCE_USERNAME=qcmuser
      - SPRING_DATASOURCE_PASSWORD=qcmpassword
      - ML_SERVICE_URL=http://ml-service:8000
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_SERVICE_ACCOUNT_B64=${FIREBASE_SERVICE_ACCOUNT_B64}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - FRONTEND_URL=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qcm_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
        - NEXT_PUBLIC_FIREBASE_DATABASE_URL=${NEXT_PUBLIC_FIREBASE_DATABASE_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost}
    environment:
      # Server-side only — used by Server Components to call the backend
      # directly through the Docker internal network (avoids external round-trip)
      - INTERNAL_API_URL=http://nginx
    container_name: qcm_frontend
    networks:
      - qcm_network
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: qcm_ml
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - qcm_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: qcm_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=qcmdb
      - POSTGRES_USER=qcmuser
      - POSTGRES_PASSWORD=qcmpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qcmuser -d qcmdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qcm_network
    restart: unless-stopped

networks:
  qcm_network:
    driver: bridge

volumes:
  postgres_data:
